name: Expand verified portfolio export
on:
  push:
    branches: [main]
    paths:
      - dalton-wisdom-portfolio-source-2026-09-22.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and expand September 22 export
        run: |
          set -euo pipefail
          archive=dalton-wisdom-portfolio-source-2026-09-22.zip
          echo "13b2e0607c123be75363736540de1db9287768bb2631f7f234af855597bd6680  $archive" | sha256sum -c -
          unzip -tq "$archive"
          mkdir -p /tmp/portfolio-export
          unzip -q "$archive" -d /tmp/portfolio-export
          cp -a /tmp/portfolio-export/dalton-wisdom-portfolio/.openai ./ 
          cp -a /tmp/portfolio-export/dalton-wisdom-portfolio/dist ./ 
          cp -a /tmp/portfolio-export/dalton-wisdom-portfolio/docs ./ 
          cp -a /tmp/portfolio-export/dalton-wisdom-portfolio/scripts ./ 
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .openai dist docs scripts
          if ! git diff --cached --quiet; then
            git commit -m "Expand verified September 22 portfolio source"
            git push
          fi
